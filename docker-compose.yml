services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackcell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackcell_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-blackcell}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackcell} -d ${POSTGRES_DB:-blackcell}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      CORS_ORIGIN: http://localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-blackcell}:${POSTGRES_PASSWORD:-blackcell_dev_password}@postgres:5432/${POSTGRES_DB:-blackcell}?schema=public
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
